[build]
  command = "pip install -r requirements.txt && echo 'Build complete'"
  functions = "api"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  included_files = ["engine/**", "prompts/**"]

[dev]
  functions = "api"

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to = "/confirmation.html"
  status = 200
  [build.environment]
  
  SECRETS_SCAN_OMIT_PATHS = "public/checkout.html,public/confirmation.html,api/webhook.js,.env.example"
  SECRETS_SCAN_OMIT_KEYS = "ISAAC_EMAIL,REPORT_EMAIL_FROM"