[build]
  command = "npm run build"
  functions = "api"
  publish = "public"

[functions]
  node_bundler = "esbuild"

[functions."*"]
  included_files = ["engine/**", "prompts/**"]

[dev]
  functions = "api"

[[redirects]]
  from = "/checkout"
  to = "/checkout.html"
  status = 200

[[redirects]]
  from = "/confirmation"
  to = "/confirmation.html"
  status = 200

[[redirects]]
  from = "/.netlify/functions/*"
  to = "/.netlify/functions/:splat"
  status = 200