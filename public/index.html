<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IM Consulting — Ingeniería Humana de Alto Rendimiento</title>
  <meta name="description" content="No es coaching. Es Ingeniería Humana: auditoría, reprogramación y ejecución de tu sistema operativo personal." />
  <meta property="og:title" content="IM Consulting — Ingeniería Humana" />
  <meta property="og:description" content="Sistema de diagnóstico para profesionales, fundadores y líderes que sienten que algo interno no escala." />
  <meta property="og:type" content="website" />
  <meta name="theme-color" content="#1A1A1A" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"><\/script>
  <style>
    :root{--ink:#1A1A1A;--ink-2:#3D3D3D;--ink-3:#888;--sand:#C8B89A;--sand-2:#DDD0BF;--sand-3:#F3EDE4;--sand-4:#FAF7F3;--white:#FFFFFF;--border:#E8E0D5;--bg:#FFFFFF;--bg-2:#FAF7F3;--bg-alt:#1A1A1A}
    [data-theme="dark"]{--ink:#F0EAD8;--ink-2:#C8BBAA;--ink-3:#7A6F62;--white:#111008;--border:#2A2520;--bg:#111008;--bg-2:#181510;--bg-alt:#0A0906;--sand-4:#1A1710;--sand-3:#221E14}
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
    html{scroll-behavior:smooth}
    body{font-family:'DM Sans',sans-serif;background:var(--bg);color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden;transition:background .3s,color .3s}
    .display{font-family:'Cormorant Garamond',serif;font-weight:300;line-height:1.05}
    a{text-decoration:none;color:inherit}
    .label{display:inline-block;font-size:.68rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);font-weight:600;margin-bottom:20px}
    .container{width:100%;max-width:1100px;margin:0 auto;padding:0 48px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:14px 30px;border-radius:3px;font-family:'DM Sans',sans-serif;font-size:.88rem;font-weight:500;letter-spacing:.06em;cursor:pointer;border:none;transition:all .3s cubic-bezier(.25,.1,.25,1);text-decoration:none}
    .btn-dark{background:var(--ink);color:var(--bg)}
    .btn-dark:hover{opacity:.85;transform:translateY(-2px);box-shadow:0 16px 40px rgba(0,0,0,.2)}
    .btn-sand{background:var(--sand);color:#fff}
    .btn-sand:hover{background:#b5a488;transform:translateY(-2px);box-shadow:0 16px 40px rgba(200,184,154,.4)}
    .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}
    .btn-ghost:hover{border-color:var(--ink);background:var(--ink);color:var(--bg)}
    .btn-lg{padding:17px 36px;font-size:.92rem}
    nav{position:fixed;top:0;left:0;right:0;z-index:300;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-bottom:1px solid transparent;transition:border-color .3s,box-shadow .3s,background .3s}
    [data-theme="dark"] nav{background:rgba(17,16,8,.92)}
    nav.scrolled{border-color:var(--border);box-shadow:0 1px 24px rgba(0,0,0,.08)}
    .nav-inner{display:flex;align-items:center;justify-content:space-between;height:68px}
    .nav-logo{display:flex;align-items:center;gap:12px}
    .nav-logo-svg{width:44px;height:44px;flex-shrink:0;color:var(--ink)}
    .nav-links{display:flex;align-items:center;gap:36px;list-style:none}
    .nav-links a{font-size:.83rem;color:var(--ink-3);letter-spacing:.04em;transition:color .2s}
    .nav-links a:hover{color:var(--sand)}
    .nav-right{display:flex;align-items:center;gap:16px}
    .theme-toggle{background:none;border:1px solid var(--border);border-radius:3px;width:36px;height:36px;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(--ink-3)}
    .theme-toggle:hover{border-color:var(--sand);color:var(--sand)}
    [data-theme="light"] .icon-moon{display:none}
    [data-theme="dark"] .icon-sun{display:none}
    .nav-mobile-btn{display:none;background:none;border:none;cursor:pointer;padding:4px;color:var(--ink)}
    .menu-overlay{display:none;position:fixed;inset:0;z-index:280;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);opacity:0;transition:opacity .3s;pointer-events:none}
    .menu-overlay.open{opacity:1;pointer-events:all}
    .menu-drawer{position:absolute;top:0;right:0;width:min(360px,90vw);height:100dvh;background:var(--bg);padding:80px 32px 40px;transform:translateX(100%);transition:transform .35s cubic-bezier(.25,.1,.25,1);display:flex;flex-direction:column;gap:0}
    .menu-overlay.open .menu-drawer{transform:translateX(0)}
    .drawer-item{padding:20px 0;border-bottom:1px solid var(--border);font-size:1.5rem;font-family:'Cormorant Garamond',serif;font-weight:300;color:var(--ink);display:block;transition:color .2s}
    .drawer-item:hover{color:var(--sand)}
    .hero{min-height:100vh;display:grid;grid-template-columns:1fr 1fr;align-items:center;padding-top:68px;overflow:hidden}
    .hero-left{padding:80px 0;position:relative;z-index:2}
    .hero-eyebrow{display:flex;align-items:center;gap:12px;margin-bottom:32px;opacity:0;animation:fadeUp .8s cubic-bezier(.25,.1,.25,1) .2s forwards}
    .eyebrow-line{width:32px;height:1px;background:var(--sand);flex-shrink:0}
    .eyebrow-text{font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--sand);font-weight:600}
    .hero-headline{font-size:clamp(2.6rem,4.5vw,4rem);line-height:1.0;color:var(--ink);margin-bottom:28px;opacity:0;animation:fadeUp .8s cubic-bezier(.25,.1,.25,1) .35s forwards}
    .hero-headline em{font-style:italic;color:var(--sand)}
    .hero-sub{font-size:1rem;color:var(--ink-3);line-height:1.8;max-width:460px;margin-bottom:48px;font-weight:300;opacity:0;animation:fadeUp .8s cubic-bezier(.25,.1,.25,1) .5s forwards}
    .hero-actions{display:flex;gap:16px;flex-wrap:wrap;opacity:0;animation:fadeUp .8s cubic-bezier(.25,.1,.25,1) .65s forwards}
    .hero-stats{display:flex;gap:40px;margin-top:56px;padding-top:40px;border-top:1px solid var(--border);opacity:0;animation:fadeUp .8s cubic-bezier(.25,.1,.25,1) .8s forwards}
    .stat-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--ink);line-height:1;margin-bottom:4px}
    .stat-num em{color:var(--sand);font-style:normal}
    .stat-label{font-size:.75rem;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
    .hero-right{position:relative;height:100%;min-height:600px;display:flex;align-items:center;justify-content:center}
    #hero-canvas{position:absolute;inset:0;width:100%;height:100%}
    .slide{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 40px 80px 0;opacity:0;transform:translateY(16px);transition:opacity .6s cubic-bezier(.25,.1,.25,1),transform .6s cubic-bezier(.25,.1,.25,1);pointer-events:none}
    .slide.active{opacity:1;transform:translateY(0);pointer-events:all}
    .slide-visual{width:200px;height:200px;margin-bottom:24px;flex-shrink:0}
    .slide-visual svg{width:100%;height:100%}
    .slide-tag{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:var(--sand);font-weight:600;margin-bottom:8px;text-align:center}
    .slide-title{font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-weight:400;color:var(--ink);text-align:center;margin-bottom:10px;line-height:1.2}
    .slide-desc{font-size:.83rem;color:var(--ink-3);text-align:center;line-height:1.7;max-width:280px}
    .slide-nav{position:absolute;bottom:28px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:20}
    .slide-dot{width:6px;height:6px;border-radius:50%;background:var(--border);cursor:pointer;transition:all .3s;border:none;padding:0}
    .slide-dot.active{background:var(--sand);transform:scale(1.4)}
    .slide-arrows{position:absolute;top:50%;transform:translateY(-50%);width:100%;display:flex;justify-content:space-between;padding:0 8px;z-index:20;pointer-events:none}
    .slide-arrow{width:32px;height:32px;border-radius:50%;background:var(--bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:all;transition:all .2s;color:var(--ink-3)}
    .slide-arrow:hover{border-color:var(--sand);color:var(--sand)}
    section{padding:112px 0}
    .problema-section{background:var(--bg-alt);color:#F0EAD8}
    [data-theme="dark"] .problema-section{background:#0A0906}
    .problema-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.07);margin-top:72px}
    .problema-card{padding:48px 40px;background:var(--bg-alt);transition:background .3s}
    [data-theme="dark"] .problema-card{background:#0A0906}
    .problema-card:hover{background:#242018}
    .problema-num{font-family:'Cormorant Garamond',serif;font-size:3rem;font-weight:300;color:rgba(200,184,154,.18);line-height:1;margin-bottom:24px}
    .problema-title{font-family:'Cormorant Garamond',serif;font-size:1.4rem;font-weight:400;color:#F0EAD8;margin-bottom:16px;line-height:1.3}
    .problema-text{font-size:.9rem;color:rgba(240,234,216,.45);line-height:1.75}
    .sistema-section{background:var(--bg)}
    .sistema-header{display:grid;grid-template-columns:1fr 1fr;gap:80px;align-items:end;margin-bottom:80px}
    .sistema-desc{font-size:1rem;color:var(--ink-3);line-height:1.8;font-weight:300}
    .sistema-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px;background:var(--border)}
    .sistema-item{background:var(--bg);padding:48px 40px;transition:background .25s}
    .sistema-item:hover{background:var(--sand-4)}
    .sistema-icon{width:44px;height:44px;border:1px solid var(--border);border-radius:3px;display:flex;align-items:center;justify-content:center;margin-bottom:28px;font-size:1.1rem}
    .sistema-title{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-weight:400;margin-bottom:14px;color:var(--ink)}
    .sistema-text{font-size:.88rem;color:var(--ink-3);line-height:1.75}
    .proceso-section{background:var(--bg-2)}
    .proceso-steps{display:grid;grid-template-columns:repeat(4,1fr);margin-top:72px;position:relative}
    .proceso-steps::before{content:'';position:absolute;top:20px;left:20px;right:20px;height:1px;background:var(--sand-2);z-index:0}
    .proceso-step{padding:0 32px 0 0;position:relative;z-index:1}
    .step-dot{width:40px;height:40px;border-radius:50%;background:var(--bg);border:1px solid var(--sand);display:flex;align-items:center;justify-content:center;font-size:.78rem;font-weight:600;color:var(--sand);margin-bottom:28px;letter-spacing:.04em}
    .step-title{font-family:'Cormorant Garamond',serif;font-size:1.2rem;font-weight:400;margin-bottom:12px;color:var(--ink)}
    .step-text{font-size:.86rem;color:var(--ink-3);line-height:1.7}
    .pricing-section{background:var(--bg)}
    .pricing-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:2px;background:var(--border);margin-top:72px}
    .price-card{background:var(--bg);padding:56px 48px;position:relative;transition:background .25s;display:flex;flex-direction:column}
    .price-card:hover{background:var(--sand-4)}
    .price-card.featured{background:var(--bg-alt)}
    [data-theme="dark"] .price-card.featured{background:#0A0906}
    .price-card.featured:hover{background:#1e1b13}
    .price-label-top{font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--sand);font-weight:600;margin-bottom:16px}
    .price-amount{font-family:'Cormorant Garamond',serif;font-size:4rem;font-weight:300;line-height:1;color:var(--ink);margin-bottom:8px}
    .price-card.featured .price-amount{color:#F0EAD8}
    .price-amount sup{font-size:1.6rem;vertical-align:super}
    .price-currency{font-size:.8rem;color:var(--ink-3);letter-spacing:.06em;margin-bottom:40px}
    .price-card.featured .price-currency{color:rgba(240,234,216,.4)}
    .price-divider{height:1px;background:var(--border);margin-bottom:32px}
    .price-card.featured .price-divider{background:rgba(255,255,255,.08)}
    .price-features{list-style:none;margin-bottom:48px;flex:1}
    .price-features li{padding:12px 0;font-size:.9rem;color:var(--ink-2);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px}
    .price-card.featured .price-features li{color:rgba(240,234,216,.65);border-color:rgba(255,255,255,.07)}
    .price-features li::before{content:'—';color:var(--sand);font-weight:300;flex-shrink:0}
    .cta-section{background:var(--bg-alt);padding:160px 0;text-align:center;position:relative;overflow:hidden}
    [data-theme="dark"] .cta-section{background:#0A0906}
    .cta-section::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse 60% 50% at 20% 50%,rgba(200,184,154,.04) 0%,transparent 60%),radial-gradient(ellipse 60% 50% at 80% 50%,rgba(200,184,154,.04) 0%,transparent 60%)}
    .cta-headline{font-size:clamp(2.5rem,6vw,4rem);color:#F0EAD8;margin-bottom:24px;position:relative;z-index:1}
    .cta-sub{font-size:1rem;color:rgba(240,234,216,.4);margin-bottom:48px;position:relative;z-index:1;font-weight:300}
    .cta-actions{display:flex;gap:16px;justify-content:center;position:relative;z-index:1;flex-wrap:wrap}
    footer{background:var(--bg);border-top:1px solid var(--border);padding:40px 0}
    .footer-inner{display:flex;align-items:center;justify-content:space-between}
    .footer-logo-svg{width:36px;height:36px;opacity:.5;color:var(--ink)}
    .footer-copy{font-size:.82rem;color:var(--ink-3)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
    .reveal{opacity:0;transform:translateY(32px);transition:opacity .8s cubic-bezier(.25,.1,.25,1),transform .8s cubic-bezier(.25,.1,.25,1)}
    .reveal.visible{opacity:1;transform:none}
    .reveal-d1{transition-delay:.1s}.reveal-d2{transition-delay:.2s}.reveal-d3{transition-delay:.3s}
    @media(max-width:960px){
      .hero{grid-template-columns:1fr;min-height:auto;padding-bottom:60px}
      .hero-right{min-height:420px;width:100%}
      .slide{padding:40px 24px 80px}
      .problema-grid{grid-template-columns:1fr}
      .sistema-header{grid-template-columns:1fr;gap:32px}
      .sistema-grid{grid-template-columns:1fr 1fr}
      .proceso-steps{grid-template-columns:1fr 1fr;gap:40px}
      .proceso-steps::before{display:none}
      .pricing-grid{grid-template-columns:1fr}
      .nav-links,.nav-right .btn-dark{display:none}
      .nav-mobile-btn{display:flex}
      .menu-overlay{display:block}
      .footer-inner{flex-direction:column;gap:12px;text-align:center}
      .container{padding:0 24px}
      .hero-left{padding:40px 0}
      .hero-stats{gap:24px}
    }
    @media(max-width:600px){
      .proceso-steps{grid-template-columns:1fr}
      .sistema-grid{grid-template-columns:1fr}
      section{padding:80px 0}
      .price-card{padding:40px 28px}
      .problema-card{padding:36px 28px}
    }
  </style>
</head>
<body>

      <div class="nav-right">

          <svg class="icon-sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
          <svg class="icon-moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>

</nav>

<div id="menuOverlay" class="menu-overlay">
  <div class="menu-drawer">
    <a href="#problema" class="drawer-item">Diagnóstico</a>
    <a href="#sistema"  class="drawer-item">Sistema</a>
    <a href="#proceso"  class="drawer-item">Proceso</a>
    <a href="#pricing"  class="drawer-item">Planes</a>
    <div style="margin-top:32px">
      <a href="checkout.html" class="btn btn-sand btn-lg" style="width:100%">Comenzar diagnóstico</a>

<section class="hero">
  <div class="hero-left container" style="padding-right:0;max-width:none;width:auto">
    <div class="hero-eyebrow">
      <span class="eyebrow-line"></span>
      <span class="eyebrow-text">Ingeniería Humana</span>
    </div>
    <h1 class="display hero-headline">
      Tu sistema operativo<br>tiene <em>fallos</em><br>que no ves.
    </h1>
    <p class="hero-sub">No es coaching. Es auditoría. Seis sistemas de diagnóstico integrados para mapear los patrones que limitan tu ejecución de alto nivel.</p>
    <div class="hero-actions">
      <a href="checkout.html" class="btn btn-sand btn-lg">Comenzar diagnóstico</a>
      <a href="#sistema" class="btn btn-ghost btn-lg">Ver el sistema</a>
    </div>
    <div class="hero-stats">
      <div><div class="stat-num">6</div><div class="stat-label">Sistemas integrados</div></div>
      <div><div class="stat-num">20<em>+</em></div><div class="stat-label">Bloques de análisis</div></div>
      <div><div class="stat-num">&lt;2<em>min</em></div><div class="stat-label">Tiempo de entrega</div></div>
    </div>
  </div>

  <div class="hero-right">
    <canvas id="hero-canvas"></canvas>

    <div class="slide-arrows">
      <button class="slide-arrow" id="prevSlide" aria-label="Anterior"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg></button>
      <button class="slide-arrow" id="nextSlide" aria-label="Siguiente"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg></button>

<script>
const root=document.documentElement,themeBtn=document.getElementById('themeToggle'),saved=localStorage.getItem('imTheme'),prefersDark=window.matchMedia('(prefers-color-scheme: dark)').matches;
if(saved)root.setAttribute('data-theme',saved);else if(prefersDark)root.setAttribute('data-theme','dark');
themeBtn.addEventListener('click',()=>{const next=root.getAttribute('data-theme')==='dark'?'light':'dark';root.setAttribute('data-theme',next);localStorage.setItem('imTheme',next)});
const navbar=document.getElementById('navbar');
window.addEventListener('scroll',()=>navbar.classList.toggle('scrolled',window.scrollY>10),{passive:true});
const menuBtn=document.getElementById('menuBtn'),menuOverlay=document.getElementById('menuOverlay');
menuBtn.addEventListener('click',()=>{menuOverlay.classList.toggle('open');document.body.style.overflow=menuOverlay.classList.contains('open')?'hidden':''});
menuOverlay.addEventListener('click',e=>{if(e.target===menuOverlay){menuOverlay.classList.remove('open');document.body.style.overflow=''}});
menuOverlay.querySelectorAll('a').forEach(a=>a.addEventListener('click',()=>{menuOverlay.classList.remove('open');document.body.style.overflow=''}));
const io=new IntersectionObserver(entries=>entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');io.unobserve(e.target)}}),{threshold:.08,rootMargin:'0px 0px -40px 0px'});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));
document.querySelectorAll('a[href^="#"]').forEach(a=>a.addEventListener('click',e=>{const t=document.querySelector(a.getAttribute('href'));if(!t)return;e.preventDefault();window.scrollTo({top:t.getBoundingClientRect().top+scrollY-72,behavior:'smooth'})}));
const slides=document.querySelectorAll('.slide'),dots=document.querySelectorAll('.slide-dot');
let current=0,autoTimer=null;
function goTo(n){slides[current].classList.remove('active');dots[current].classList.remove('active');current=(n+slides.length)%slides.length;slides[current].classList.add('active');dots[current].classList.add('active')}
function startAuto(){autoTimer=setInterval(()=>goTo(current+1),4000)}
function resetAuto(){clearInterval(autoTimer);startAuto()}
document.getElementById('nextSlide').addEventListener('click',()=>{goTo(current+1);resetAuto()});
document.getElementById('prevSlide').addEventListener('click',()=>{goTo(current-1);resetAuto()});
dots.forEach(d=>d.addEventListener('click',()=>{goTo(+d.dataset.slide);resetAuto()}));
let tx=0;const hr=document.querySelector('.hero-right');
hr.addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
hr.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-tx;if(Math.abs(dx)>40){goTo(dx<0?current+1:current-1);resetAuto()}},{passive:true});
startAuto();
(function(){
  const canvas=document.getElementById('hero-canvas');
  if(!canvas||typeof THREE==='undefined')return;
  const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:true});
  renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
  renderer.setClearColor(0x000000,0);
  const scene=new THREE.Scene(),camera=new THREE.PerspectiveCamera(45,1,.1,100);
  camera.position.set(0,0,5);
  const wire=c=>new THREE.MeshBasicMaterial({color:c,wireframe:true,transparent:true,opacity:.15});
  const meshMain=new THREE.Mesh(new THREE.IcosahedronGeometry(1.55,1),wire(0xC8B89A));
  const meshInner=new THREE.Mesh(new THREE.OctahedronGeometry(.95,2),new THREE.MeshBasicMaterial({color:0xC8B89A,wireframe:true,transparent:true,opacity:.06}));
  scene.add(meshMain,meshInner);
  [[2.1,.004,Math.PI/3,0],[1.75,.003,Math.PI/2,Math.PI/4]].forEach(([r,t,rx,ry])=>{const m=new THREE.Mesh(new THREE.TorusGeometry(r,t,2,80),new THREE.MeshBasicMaterial({color:0xC8B89A,transparent:true,opacity:.15}));m.rotation.x=rx;m.rotation.y=ry;scene.add(m)});
  const lm=new THREE.LineBasicMaterial({color:0xC8B89A,transparent:true,opacity:.2});
  [[-2.5,0,0,2.5,0,0],[0,-2.5,0,0,2.5,0],[0,0,-2.5,0,0,2.5]].forEach(([x1,y1,z1,x2,y2,z2])=>{const g=new THREE.BufferGeometry().setFromPoints([new THREE.Vector3(x1,y1,z1),new THREE.Vector3(x2,y2,z2)]);scene.add(new THREE.Line(g,lm))});
  const ptPos=new Float32Array(60*3);
  for(let i=0;i<60;i++){const r=2.4+Math.random()*1.2,t=Math.random()*Math.PI*2,p=Math.acos(2*Math.random()-1);ptPos[i*3]=r*Math.sin(p)*Math.cos(t);ptPos[i*3+1]=r*Math.sin(p)*Math.sin(t);ptPos[i*3+2]=r*Math.cos(p)}
  const ptGeo=new THREE.BufferGeometry();ptGeo.setAttribute('position',new THREE.BufferAttribute(ptPos,3));
  scene.add(new THREE.Points(ptGeo,new THREE.PointsMaterial({color:0xC8B89A,size:.022,transparent:true,opacity:.4})));
  const resize=()=>{const w=canvas.clientWidth,h=canvas.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix()};
  resize();new ResizeObserver(resize).observe(canvas);
  let mx=0,my=0;
  document.addEventListener('mousemove',e=>{mx=(e.clientX/innerWidth-.5)*.35;my=(e.clientY/innerHeight-.5)*.35},{passive:true});
  const clock=new THREE.Clock();
  (function animate(){requestAnimationFrame(animate);const t=clock.getElapsedTime();meshMain.rotation.y=t*.07+mx;meshMain.rotation.x=t*.04+my;meshInner.rotation.y=-t*.1;meshInner.rotation.z=t*.05;renderer.render(scene,camera)})();
})();
</script>
</body>
